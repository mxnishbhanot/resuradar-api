services:
  - type: web
    name: resume-analyzer-api
    env: node
    plan: starter
    region: oregon

    # Puppeteer will download Chromium during npm install
    buildCommand: npm install

    # Start your Node server
    startCommand: npm start

    envVars:
      # Tell Puppeteer to download its bundled Chromium
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "false"

      # Required: Render stores the browser here
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/.cache/puppeteer

      # Optional but recommended
      - key: NODE_ENV
        value: production
